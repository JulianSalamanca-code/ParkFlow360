spring:
  application:
    name: ParkFlow360

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${DB_USERNAME:postgres.pmijcynowbvxvqrratst}
    password: ${DB_PASSWORD:${SUPABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:clave-secreta-jwt-muy-segura-y-larga-para-parkflow360}
  expiration: ${JWT_EXPIRATION:86400000}

# Login con Google (Google Identity Services)
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Pago en línea con Wompi
wompi:
  public-key: ${WOMPI_PUBLIC_KEY:}
  private-key: ${WOMPI_PRIVATE_KEY:}
  events-secret: ${WOMPI_EVENTS_SECRET:}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
  checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
  api-url: ${WOMPI_API_URL:https://sandbox.wompi.co/v1}
  currency: ${WOMPI_CURRENCY:COP}

# Orígenes permitidos para CORS (separados por coma)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
