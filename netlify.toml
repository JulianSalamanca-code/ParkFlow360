# Configuración de despliegue en Netlify para ParkFlow360 (frontend Angular)

[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist/frontend/browser"

# IMPORTANTE: las reglas se evalúan de arriba hacia abajo.
# El proxy de la API debe ir ANTES del redirect SPA.
[[redirects]]
  from = "/api/*"
  to = "https://parkflow360.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: redirigir todas las demás rutas al index.html para el router de Angular
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
