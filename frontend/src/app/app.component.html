<div class="app-shell" [ngClass]="{ authed: isAuthenticated$ | async }">
  <div class="nav-backdrop" *ngIf="mobileNavOpen" (click)="closeMobileNav()"></div>

  <aside id="app-sidebar" class="sidebar" *ngIf="isAuthenticated$ | async" [class.open]="mobileNavOpen">
    <div class="sidebar-scroll">
      <div class="brand" [routerLink]="(homePath$ | async) || '/'" (click)="closeMobileNav()">
        <span class="brand-mark">P</span>
        <div>
          <div class="brand-name">ParkFlow</div>
          <div class="brand-sub">Pro Control</div>
        </div>
      </div>

      <ng-container *ngFor="let section of sidebarSections$ | async">
        <div class="nav-section-label">{{ section.label }}</div>
        <nav class="nav">
          <a *ngFor="let item of section.items"
             [routerLink]="item.path"
             routerLinkActive="active"
             (click)="closeMobileNav()"
             [attr.data-testid]="item.dataTestId">
            <span class="material-symbols-outlined">{{ item.icon }}</span> {{ item.label }}
          </a>
        </nav>
      </ng-container>
    </div>

    <div class="sidebar-footer">
      <div class="terminal-card">
        <div class="row">
          <span class="brand-sub">Terminal Activa</span>
          <span class="row">
            <span class="online-dot"></span>
            <strong style="font-size:11px;color:var(--pf-available-text)">ONLINE</strong>
          </span>
        </div>
        <div>
          <div style="font-weight:700;font-size:13px">{{ userName }}</div>
          <div class="brand-sub" style="letter-spacing:0">{{ userRole }}</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar" *ngIf="isAuthenticated$ | async">
      <div class="clock">
        <span class="material-symbols-outlined">schedule</span>
        <span class="time">{{ clock }}</span>
        <span class="date">{{ today }}</span>
      </div>

      <div class="user-box">
        <div class="user-meta">
          <div class="name">{{ userName }}</div>
          <div class="role">{{ userRole }}</div>
        </div>
        <div class="avatar">{{ (userName || 'U').charAt(0) }}</div>
        <button class="btn btn-ghost btn-sm" (click)="logout()" title="Cerrar sesión"
                [attr.data-testid]="'btn-logout'">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <main class="content" [ngClass]="{ full: !(isAuthenticated$ | async) }">
      <router-outlet></router-outlet>
    </main>
  </div>

  <nav class="bottom-nav" *ngIf="isAuthenticated$ | async" [attr.data-testid]="'bottom-nav'">
    <a *ngFor="let item of bottomItems$ | async"
       class="bottom-nav-item"
       [routerLink]="item.path"
       routerLinkActive="active"
       (click)="closeMobileNav()"
       [attr.data-testid]="'bottom-nav-item-' + item.id">
      <span class="material-symbols-outlined">{{ item.icon }}</span>
      <span class="bottom-nav-label">{{ item.shortLabel }}</span>
    </a>

    <button type="button" class="bottom-nav-item bottom-nav-menu"
            (click)="toggleMobileNav()"
            [attr.aria-expanded]="mobileNavOpen"
            aria-controls="app-sidebar"
            [attr.aria-label]="mobileNavOpen ? 'Cerrar menú' : 'Abrir menú'"
            [attr.data-testid]="'nav-hamburger'">
      <span class="material-symbols-outlined">{{ mobileNavOpen ? 'close' : 'menu' }}</span>
      <span class="bottom-nav-label">Menú</span>
    </button>
  </nav>
</div>

<app-toast-container></app-toast-container>
