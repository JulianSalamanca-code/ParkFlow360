spring:
  application:
    name: ParkFlow360

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${DB_USERNAME:postgres.pmijcynowbvxvqrratst}
    password: ${DB_PASSWORD:${SUPABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:clave-secreta-jwt-muy-segura-y-larga-para-parkflow360}
  expiration: ${JWT_EXPIRATION:86400000}

# Orígenes permitidos para CORS (separados por coma)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
