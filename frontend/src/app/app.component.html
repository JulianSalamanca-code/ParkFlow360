<div class="app-container">
  <ng-container *ngIf="isAuthenticated$ | async">
    <header class="navbar">
      <div class="navbar-inner">
        <a routerLink="/vehiculos" class="navbar-brand">
          <span class="brand-mark">P</span>
          <span class="brand-text">ParkFlow<span>360</span></span>
        </a>

        <nav class="navbar-menu">
          <a routerLink="/vehiculos" routerLinkActive="active">
            <span class="nav-icon">🚗</span> Vehículos
          </a>
          <a routerLink="/espacios" routerLinkActive="active">
            <span class="nav-icon">🅿️</span> Espacios
          </a>
          <a routerLink="/tarifas" routerLinkActive="active">
            <span class="nav-icon">💲</span> Tarifas
          </a>
          <a routerLink="/pagos" routerLinkActive="active">
            <span class="nav-icon">🧾</span> Pagos
          </a>
          <a routerLink="/reportes" routerLinkActive="active">
            <span class="nav-icon">📊</span> Reportes
          </a>
        </nav>

        <div class="navbar-user">
          <div class="user-info">
            <span class="user-avatar">{{ (userName || 'U').charAt(0) }}</span>
            <span class="user-name">{{ userName }}</span>
          </div>
          <button (click)="logout()" class="btn-logout" title="Cerrar sesión">
            Salir
          </button>
        </div>
      </div>
    </header>
  </ng-container>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
