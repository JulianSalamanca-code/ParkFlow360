spring:
  application:
    name: ParkFlow360-Test

  datasource:
    url: jdbc:h2:mem:parkflow360;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

server:
  port: 0

jwt:
  secret: test-secret-key-for-testing-purposes-only
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:4200
  scheduling:
    enabled: false
