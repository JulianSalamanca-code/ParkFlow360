spring:
  application:
    name: ParkFlow360
  
  datasource:
    url: jdbc:postgresql://localhost:5432/parkflow360
    username: parkflow360
    password: parkflow360
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:clave-secreta-jwt-muy-segura-y-larga-para-parkflow360}
  expiration: 86400000
