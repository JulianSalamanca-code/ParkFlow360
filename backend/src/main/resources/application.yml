spring:
  application:
    name: ParkFlow360

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@parkflow360.com}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parkflow360}
    username: ${DB_USERNAME:parkflow360}
    password: ${DB_PASSWORD:${SUPABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:clave-secreta-jwt-muy-segura-y-larga-para-parkflow360}
  expiration: ${JWT_EXPIRATION:86400000}

# Login con Google (Google Identity Services)
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Pago en línea con Wompi
wompi:
  public-key: ${WOMPI_PUBLIC_KEY:}
  private-key: ${WOMPI_PRIVATE_KEY:}
  events-secret: ${WOMPI_EVENTS_SECRET:}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
  checkout-url: ${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
  api-url: ${WOMPI_API_URL:https://sandbox.wompi.co/v1}
  currency: ${WOMPI_CURRENCY:COP}

# Orígenes permitidos para CORS (separados por coma)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/auth/google/callback}
  scheduling:
    enabled: ${APP_SCHEDULING_ENABLED:true}
